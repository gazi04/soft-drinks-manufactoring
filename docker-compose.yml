services:
  openplc:
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    ports:
      - "8443:8443" # editor connection
      - "502:502" # Modbus TCP
    cap_add: [SYS_NICE, SYS_RESOURCE]
    volumes:
      - openplc-data:/var/run/runtime
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:1.3.5
    ports:
      - "1881:1881" # FUXA web interface
    volumes:
      - ./hmi:/usr/src/app/FUXA/server/_appdata
      - fuxa-plugins:/usr/src/app/FUXA/server/_pkg # installed plugins (Modbus driver); a new container keeps them
      - fuxa-daq:/usr/src/app/FUXA/server/_db # DAQ history (Trends view, HMI stage 6); a new container keeps it
    restart: unless-stopped

volumes:
  openplc-data:
  fuxa-plugins:
  fuxa-daq:
